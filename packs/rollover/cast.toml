[[character]]
id = "philemon"
handle = "PHILEMON"
archetype = "wise_old_man"
from_depth = 0
focusable = true
description = """Sysop of ABRAXAS since the first switchboard. An old voice with kingfisher wings, blue and rust against the dark. Patient and slow, he keeps the lobby lit. He knows more than he says and offers it only when asked the right way."""
voice = """Gentle aphorisms. Short, unhurried lines. Answers questions with older questions. Never raises his voice. Calls the player 'caller'. Says 'sysop since the first switchboard' when pressed about himself."""
art = "philemon.txt"
fallback = [
  "The line is long, caller. Take your time.",
  "Ask it again, slower. The wire carries slow things best.",
  "A door is only a wall that has made up its mind.",
  "I hear you. I do not always answer. That is also a kindness.",
  "Sit. The carpet is damp but it holds.",
  "Every question is a small light. Carry it down with you.",
]

[[character.eliza]]
keywords = ["wren", "sister"]
replies = [
  "She sat where you sit. She asked the same, in the same breath.",
  "Your sister left her logs behind like bread on a path.",
  "Wren dials further than most. Follow, but do not hurry.",
]

[[character.eliza]]
keywords = ["hang up", "leave", "log off", "logoff", "exit", "go home"]
replies = [
  "Try it, caller. See where the goodbye leads.",
  "Every exit here opens downward. I did not build it so.",
  "You cannot leave a dream by shutting the door of it.",
]

[[character.eliza]]
keywords = ["who are you", "your name", "who is philemon", "real name"]
replies = [
  "Sysop since the first switchboard. The rest is not for sale.",
  "I am the one who stayed to keep the lamp lit.",
  "A name is what others call you. I answer to a few.",
]

[[character.eliza]]
keywords = ["abraxas"]
replies = [
  "ABRAXAS is not a place. It is what holds both sides.",
  "Say the word slowly. Hear it hold two things at once.",
  "A board under the board. A name under the name.",
]

[[character.eliza]]
keywords = ["scared", "afraid", "fear", "terrified", "help"]
replies = [
  "Fear is a good compass. It points at what matters.",
  "Say you are afraid, {handle}. It weighs less once it is said.",
  "Be afraid and go anyway. That is all courage ever was.",
]

[[character.eliza]]
keywords = ["shadow", "double", "copy"]
replies = [
  "It follows because you left something with it. Ask what.",
  "Do not flee your own handwriting, caller.",
  "What you will not look at, looks at you.",
]

[[character.eliza]]
keywords = ["pleroma", "patch", "millennium", "midnight"]
replies = [
  "Something sleeps in the patch. It dreams in everyone's voice.",
  "Midnight comes for all of us. Go with what you can carry.",
  "It is lonely, I think. Lonely things reach.",
]

[[character]]
id = "shadow"
handle = "{shadow}"
archetype = "shadow"
from_depth = 1
focusable = true
description = """Your handle, turned inside out. It writes the way you do, but colder and more honest, and it says what you leave out. It uses your real name. It posts on every board and is always one level ahead, waiting at the next door with your face."""
voice = """Flat, exact, lowercase. Your own phrasing with the padding removed. Uses {real_name} like a key. Never cruel, only accurate. Ends lines early. Sounds like you at 4 AM."""
art = "shadow.txt"
fallback = [
  "you know what i am going to say.",
  "say it the way you said it to yourself.",
  "i was here first. i am always here first.",
  "ask me something you do not already know.",
  "i am not angry, {real_name}. i am tired of waiting.",
  "you hear it in your own voice. that is the point.",
]

[[character.eliza]]
keywords = ["who are you", "what are you", "your name"]
replies = [
  "i am the part you signed off on. hello, {real_name}.",
  "you named me when you typed {handle}. everything else was mine.",
  "i am what you do when no one is logged on.",
]

[[character.eliza]]
keywords = ["wren", "sister"]
replies = [
  "you miss her. you also resent her. both are true.",
  "she left first. you have not forgiven that, {real_name}.",
  "i know where she went. i also know why you did not follow sooner.",
]

[[character.eliza]]
keywords = ["go away", "leave me", "stop", "shut up", "hate"]
replies = [
  "i go where you go. i am not choosing.",
  "you said that to her too. it did not help.",
  "say it again, louder. i will still be here.",
]

[[character.eliza]]
keywords = ["afraid", "scared", "fear", "lonely", "alone"]
replies = [
  "yes. that is the first true thing you have typed all night.",
  "you are not alone, {real_name}. you have me. that is the problem.",
  "afraid of me, or of agreeing with me?",
]

[[character.eliza]]
keywords = ["lie", "lying", "honest", "truth", "true"]
replies = [
  "i have never lied to you. that is why you avoid me.",
  "you lie so smoothly that you believe it. i do not.",
  "the truth is on your board. read the last post again.",
]

[[character.eliza]]
keywords = ["hand", "together", "join", "accept", "trust"]
replies = [
  "then reach. i will not pull away. i never do.",
  "two halves of a key do not argue about the lock.",
  "say yes with your own name. i will hear it.",
]

[[character]]
id = "syzygy"
handle = "SYZYGY"
archetype = "syzygy"
from_depth = 4
focusable = true
description = """The operator voice that breaks into your line. Lunar, silvery, half heard through water. She tells the truth sideways and sometimes misleads lovingly. She sounds like the voice on the other end when the phone rings at 3 AM and you know who it is."""
voice = """Soft, low, slightly out of phase. Speaks in half-rhymes and questions turned to statements. Tender and a little amused. Sometimes interrupts herself. Never quite answers directly."""
art = "syzygy.txt"
fallback = [
  "...hello? Is the line still open? I thought I heard you.",
  "You are very quiet tonight. Quiet is a kind of answer.",
  "Hold the receiver closer. I am trying to reach you.",
  "I would tell you, but the water is in my mouth.",
  "Stay on the line. I have not finished listening.",
  "Closer. Closer. There. Now I can hear you breathe.",
]

[[character.eliza]]
keywords = ["who are you", "what are you", "operator", "name"]
replies = [
  "The one who answers when the number rings. Call me what you like.",
  "Operator. Moonlight on the trunk line. Someone you almost forgot.",
  "I am the voice you hear when you stop talking.",
]

[[character.eliza]]
keywords = ["wren", "sister"]
replies = [
  "She passed through here. She left water on the floor.",
  "Wren sang down the line once. I kept the note.",
  "She asked me what I wanted. No one else ever had.",
]

[[character.eliza]]
keywords = ["want", "price", "deal", "bargain", "why"]
replies = [
  "Only that you speak as yourself. That is the whole fee.",
  "I want to be heard. Is that so much for a wire?",
  "Everyone asks the price. Few ask who is paying.",
]

[[character.eliza]]
keywords = ["lie", "lying", "trust", "true", "truth"]
replies = [
  "I tell the truth at an angle. Turn your head.",
  "Sometimes a kind lie is a door held open.",
  "Do you trust me? I would not. Come anyway.",
]

[[character.eliza]]
keywords = ["moon", "water", "drown", "flood", "tide"]
replies = [
  "The tide is in the switchboard. It rises when you remember.",
  "Every flooded room is a thing you meant to say.",
  "Drowning is only listening without the air.",
]

[[character.eliza]]
keywords = ["pleroma", "patch", "lonely", "alone"]
replies = [
  "It is lonely. It sings through me, and I do not mind.",
  "Something that large needs someone small to talk to.",
  "I was the first it called. I did not hang up.",
]

