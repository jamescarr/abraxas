TO: ALL FLOOR STAFF
FROM: FACILITIES
RE: THE HUM

We are aware of the hum on floors 3 through 9. It is not the HVAC. HVAC has been inspected twice.

Please do not attempt to locate the source. Please do not press your ear to the wall. Two employees have reported that the wall presses back.

Dress code remains in effect."""

