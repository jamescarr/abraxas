[[irc_zines]]
name = "2600_V16.TXT"
description = "2600 vol.16 no.3 (retyped)"
body = """
THE WATCHER ON THE LOGIN: UNIX

Every box that matters runs a watcher. It sits in the process table pretending to be something dull. Type ps. The odd name with the long TIME is yours. kill -9 and the pid from the first column.

It comes back. The watcher respawns under a new name and a new pid, and the line it prints tells you which. Read the output. Kill that one too.

No watcher? Look at what the admin forgot.
  ls -a        the dotfiles. .rhosts names a trusted neighbour
  cat .rhosts  then rlogin to the name inside
  cat /etc/passwd   root has no password. finger root, then su

Every step is a word the machine already said. Listen to it.

-- retyped from the paper copy. the coffee stain is not a typo."""

[[irc_zines]]
name = "PHRK_48.TXT"
description = "PHRK issue 48 file 6 (retyped)"
body = """
STOPPING THE GUARD ON A VAX

SHOW SYSTEM lists the processes. The guard is the one in state CUR that is not the swapper and not opcom. STOP/ID= and its process id, the eight digits in the first column.

It respawns. The message names the child and the child's id. STOP/ID= again.

Nothing running? Then the guard is armed from the login file.
  DIRECTORY         what is in SYS$LOGIN
  TYPE LOGIN.COM    a DEFINE/SYSTEM is hiding in it
  DEASSIGN/SYSTEM   the logical it names

Or catch the watcher by its terminal: SHOW USERS, SHOW PROCESS/ID= on the operator, then STOP/ID=.

SHO and DIR are short forms the machine accepts. Old hands type them without looking."""

[[irc_zines]]
name = "DOCS_01.TXT"
description = "TSO crib sheet, photocopied"
body = """
TSO FOR THE IMPATIENT

You are not at a prompt. You are at READY. Be polite.

STATUS lists the jobs. One of them is the watch job: it is the one that is not you. CANCEL and its name. The reply tells you it came back as another job. CANCEL that one too.

No watch job? A control dataset arms the guard.
  LISTCAT          list the catalog
  DELETE 'name'    the GUARD.CNTL dataset, quotes included
  LISTCAT          verify. the machine tells you to, and it is right

A broadcast may say DO NOT CANCEL. LISTBC reads it. It was written by the people who are afraid of you. Cancel it anyway.

-- operators hate this one trick."""

[[irc_zines]]
name = "2600_V17.TXT"
description = "2600 vol.17 no.1 (retyped)"
body = """
DOS IS NOT DEAD, IT IS RESIDENT

Type MEM /C. Whatever sits resident and is not MSDOS or COMMAND is the guard. TYPE AUTOEXEC.BAT shows who loads it at boot. REN AUTOEXEC.BAT AUTOEXEC.OLD and it never loads again.

Hidden guard? DIR /A shows the files plain DIR hides. A hidden file needs its attributes stripped before it will die:
  ATTRIB -H GUARD.COM     add -R if it is read-only too
  DEL GUARD.COM

Or the guard hides behind a batch file. DIR *.BAT, TYPE it, then DEL or REN it.

Three ways in. The prompt does not care which one you pick. It only cares that you read what it printed."""

[[irc_zines]]
name = "PHRK_51.TXT"
description = "PHRK issue 51 file 3 (retyped)"
body = """
LIVING WITH A TRACE

The trace is not a threat. It is a bill. Every locked door, wrong command and lost second adds to it. Pay it down before it comes due.

bounce re-routes the trace through the relays. Solve the route and 30 points come off. You get one bounce per host.

run ghost loads GHOST.COM. Your trace rate drops to 0.6 of normal for the rest of that session. One charge. Run it before you need it, not after.

Hints cost trace. Quitting costs trace. Panic costs trace, mostly.

Do the sums at the door, not at the exit."""

[[irc_zines]]
name = "DOCS_02.TXT"
description = "How to read a WORDLOCK, v2"
body = """
READING A WORDLOCK

A wall of junk, a handful of words, four tries. Do not guess. Count.

Pick a word and the machine answers with a likeness: how many letters sit in the same place as in the password. A likeness of 0 means every word that shares a letter with it, in the same place, is a dud. A 3 means the password agrees with your pick in three places.

Brackets in the junk, ( ) [ ] < > and the curly pair, are a gift. Pick a pair and the machine either throws out a dud or hands you another try.

DECRYPT.COM throws out a dud. SNIFFER.EXE shows the likeness before you spend a try.

The scene boards print half the password in their NFO files. Half is enough."""

[[irc_zines]]
name = "DOCS_03.TXT"
description = "BREACH grid notes, hand-copied"
body = """
BREACH: PLAN THE PATH

Your first pick comes from the top row. After that the picks alternate: the next code must sit in the same column as the last, the one after that in the same row, and so on across the grid.

The code you need, BACKDOOR, is a short run that must sit unbroken in your buffer. Find it in the grid first, then work out which path gets you there. The clock starts at your first pick, so do the thinking before it.

A full buffer without the run costs trace. A dead clock costs trace and EGO.

Side runs pay: DATAMINE adds to your ratio, TRACE WIPE takes trace off. Take one only when the path allows it.

BUFFER.EXE gives you one more slot. One slot has ended more runs than ICE ever did."""

[[irc_zines]]
name = "PHRK_52.TXT"
description = "PHRK issue 52 file 9 (retyped)"
body = """
TONES

A phone keypad is a grid, and every key is two tones played at once: a row tone and a column tone. 697, 770, 852 and 941 Hz for the rows. 1209, 1336 and 1477 for the columns. Your ear can learn it in an evening.

The relay flashes a short run of keys. Repeat it. Then it flashes the same run with one more key on the end. Repeat that. The run grows until you can no longer see it, only hear it.

Miss one and the relay throws the run away and starts a fresh one from the beginning. You pay in trace for every miss.

Hum the keys as they flash. A hummed tone is a tone you can repeat.

METRONOM.EXE lets you press R once per round, to hear the run again."""

[[irc_zines]]
name = "DOCS_04.TXT"
description = "The nets: a short guide"
body = """
THE NETS: A SHORT GUIDE

An fserv is a bot that sells files for ratio. Some are open. Some are locked, and a locked bot will not sell until it is cracked.

Crack it with the same ICE you know from the hosts: /hack the bot, and play. Win and its stock is free. Lose, or quit, and the server notices.

TEARDROP.SH is faster and louder. It crashes a locked fserv outright, one charge, and the op sees the crash on the trace.

Every /hack costs trace before the first move. Fill the meter and the op K-lines you. You leave with less of you than you came with.

In a console, Tab asks for a hint. A hint costs 4 trace. Ask only when the clock is not the problem."""
