[[eliza]]
keywords = ["hello", "hi ", "hey", "greetings"]
replies = [
  "Hello. Mind the wet carpet. It was not wet an hour ago.",
  "Hey there. You look like someone who took a wrong turn on purpose.",
  "Evening, caller. Or morning. The clock down here has its own ideas.",
]

[[eliza]]
keywords = ["help", "stuck", "lost", "how do i"]
replies = [
  "Type help in a host shell. It tells you what the machine allows.",
  "Read the board first. Somebody always leaves a clue in plain sight.",
  "Stuck is a slow kind of moving. Check the file library.",
  "Passwords hide in the posts. No front door is as locked as they say.",
]

[[eliza]]
keywords = ["file", "download", "upload", "ratio", "program"]
replies = [
  "Your ratio is what it is. Finish a door and the library opens up.",
  "Files are cheap. Their cost is never in the description.",
  "Download what you can carry. Some programs weigh more than their size.",
]

[[eliza]]
keywords = ["wren", "sister", "missing"]
replies = [
  "Wren. Yes. She passed through humming something. Left the light on.",
  "I do not say where she went. I say where the lit rooms are.",
  "People vanish on this wire. Some are just behind the glass.",
  "She was careful. Careful does not always help. It is a kind of love.",
]

[[eliza]]
keywords = ["who are you", "who r u", "what are you", "your name", "are you real"]
replies = [
  "I am the one who answers the phone. That is most of what a sysop is.",
  "Real is a big word at this hour. I am here. You are here. Start there.",
  "Call me what the board calls me. Names stick better than faces.",
]

[[eliza]]
keywords = ["hang up", "leave", "log off", "logoff", "quit", "exit", "go home"]
replies = [
  "Hang up if you like. Tell me what picks up on the other end.",
  "There is a door marked Goodbye. It only goes down. Everyone tries it.",
  "Leaving is possible. Arriving back where you started is the hard part.",
]

[[eliza]]
keywords = ["scared", "afraid", "fear", "nervous", "help me", "creepy"]
replies = [
  "Good. Fear is the part of you that still believes the room is real.",
  "Everyone is scared down here. The ones who admit it walk faster.",
  "Breathe. Count the hum. It is only a machine pretending to be a house.",
]

[[eliza]]
keywords = ["door", "host", "hack", "ice", "password", "trace"]
replies = [
  "Doors are honest. They lead where they say, just not where you hoped.",
  "Watch the trace meter. It does not care why you are in a hurry.",
  "Passwords are in the posts. Look for the one nobody wanted to write.",
  "If the ICE is black, bring something for your nerves. Or someone.",
]

[[eliza]]
keywords = ["shadow", "double", "reflection", "mirror"]
replies = [
  "It posts here too. Writes like you, minus the hedging. Read it twice.",
  "Do not call it a stranger. It knows where you keep everything.",
  "Mirrors are fine. Watch the ones that blink first.",
]

# pool-b.toml: arrays of tables for the rollover pool (posts, files, choices, exits).

[[post]]
from = "{shadow}"
subject = "you read the last one"
body = """
I watched you read the last post. You moved your lips. You always do that when you are afraid, {real_name}.

I am not angry. I only want you to know I am here, one board ahead, keeping the chair warm. Take your time. The carpet is damp, but it holds."""

[[post]]
from = "{shadow}"
subject = "re: what you said at the door"
body = """
You told the sysop you were fine. You are not fine. Your hands have been cold since 12/10.

I say what you will not. That is the whole arrangement, {handle}. Somebody has to."""

[[post]]
from = "{shadow}"
subject = "name"
body = """
They call you {handle} here. It is a good handle. It is a coat.

I am the one who knows your real name. {real_name}. See? Nothing broke. Nothing ever does until it has to."""

[[post]]
from = "{shadow}"
subject = "I kept your place"
body = """
Every board you leave, I stay behind for a minute and read what you wrote. You are kinder in writing than you are in person.

I do not think that is a virtue. I think it is a draft."""

[[post]]
from = "{shadow}"
subject = "do not look at the monitor"
body = """
Do not look at the dark part of the monitor. I mean the part where the phosphor has gone out and the room is reflected.

Too late. Good. Now you know who blinks first."""

[[post]]
from = "{shadow}"
subject = "tomorrow"
body = """
The user list says I was last on tomorrow. It is not a bug. I have already been where you are going, and it is not as bad as you think.

It is worse in a different direction."""

[[post]]
from = "{shadow}"
subject = "honest answers"
body = """
You asked yourself why you never hung up. Here is the answer you did not want: you wanted to be found.

Wren knew. That is why she left the phone off the hook."""

[[post]]
from = "{shadow}"
subject = "re: re: re: you"
body = """
I am tired of being the one who says it. So here it is once, plain, and you can pretend it was line noise.

You are afraid there is nothing under the handle. There is. It is me. Come and meet your landlord, {handle}."""

[[post]]
from = "{shadow}"
subject = "a small kindness"
body = """
You left the hall light on in your head again. I turned it off. You will sleep better down here.

You are welcome."""

[[post]]
from = "{shadow}"
subject = "weather report"
body = """
Rain on the Lowtide. Rain in the modem. Rain on the inside of the glass where you cannot wipe it.

I counted your breaths while you read this. Eleven. You are calm. You are lying again."""

[[post]]
from = "PALEHORSE"
subject = "WTB: any carrier at all"
body = """
Paying 40K ratio for a clean carrier tone. Not a loop. Not a recording. A real one, with a person at the far end breathing.

Last three I bought were all my own voice. Reply here. Do not call me, my phone rings in a different room now."""

[[post]]
from = "DRYWALL"
subject = "the hallway is longer"
body = """
Anyone else notice the hallway outside the sysop's office got longer since Tuesday? I counted 31 doors. Yesterday 29.

Fluorescent tubes all humming the same note. Pretty sure it is an A. Pretty sure it is getting flatter."""

[[post]]
from = "NIGHTOWL_9"
subject = "Rollover party, anyone?"
body = """
Throwing a countdown thing at the laundromat on Tidewater St. Bring your own deck. Machines 4 through 7 are free to use as tables.

If you see the dryer door open on its own, that is just the building settling. Do not look inside."""
[[post]]
from = "SYSOP_LEN"
subject = "please call my board"
body = """
My board has had zero callers since the 10th. Not one. I still log in every night and read the empty list.

I am not asking for much. Call, say hi, drop a line in the guestbook. I will pay in files. I have a lot of files."""

[[post]]
from = "Vex_Lacuna"
subject = "re: has anyone seen WREN"
body = """
I talked to her on the 9th. She said she was going to find what was eating the net. I said that is a hell of a hobby.

She laughed. It sounded like she was in a stairwell. There was a second laugh a half second behind hers."""

[[post]]
from = "ROOT_BEER"
subject = "FAQ: why is the sky green"
body = """
It is not green. It is the color of a monitor that nobody is looking at.

Please stop posting about the sky. The sysop has asked nicely. The sky has not."""

[[post]]
from = "TWOBIT"
subject = "trade: voicemail for voicemail"
body = """
I have 14 messages from a number that does not exist. All of them are my mother saying my name, and then a long silence, and then my name again.

Will trade for anything with a different voice. Even a busy signal."""

[[post]]
from = "halcyon_kid"
subject = "28.8 is a state of mind"
body = """
Bought the HALCYON 28.8 FAXMODEM off a guy at the swap meet. It connects before I dial. Handshake screech is already in progress when I pick up the phone.

Is that normal? It is fast, at least."""

[[post]]
from = "ELEVATOR_MUSIC"
subject = "level report: carpet"
body = """
Found a room of yellowed carpet and fluorescent panels, maybe 400 feet each way. Walls the color of old keyboards. Hum at about 60 cycles.

No exits marked. I walked until my feet hurt and arrived where I started. Notes: it smells like a phone book left in the rain."""

[[post]]
from = "mothball"
subject = "do NOT patch tonight"
body = """
Tell everyone. The MILLENNIUM PATCH is not a patch. I read the install script. It has a lullaby in it, comments and all.

Somebody at ODS wrote a lullaby into the installer and then left a note: she is nearly awake."""

[[post]]
from = "KRYPTIC_NUN"
subject = "swap: exits"
body = """
Have: one stairwell, carpeted, humming. Want: anything that goes up.

Everything I find goes down. I do not mind. I just want to know it is a choice."""

[[post]]
from = "pinhead"
subject = "re: the Lowtide payphones"
body = """
All the payphones on Lowtide ring at 11:00 now. Not together. One at a time, walking up the block toward the laundromat.

I counted. The next one is the one outside your building."""

[[post]]
from = "SPOOLER"
subject = "ODS exchange hours"
body = """
The Tidewater exchange is half underwater. I do not mean flooded. I mean the dream version has a waterline, and the operators are standing in it up to their knees, working.

They do not look up. Do not splash."""

[[post]]
from = "{shadow}"
subject = "the other chair"
body = """
There is a second chair at every terminal you sit at. You never turn around. I do not take it personally.

It is just that someone has been sitting in it since you were nine."""

[[post]]
from = "OLD_SPARKY"
subject = "BBS etiquette, a reminder"
body = """
1. Do not post your real phone number. 2. Do not post anyone else's. 3. If a post is signed with your own handle and you did not write it, do not reply. 4. If it reads like your handwriting, close the terminal and eat something.

That is all. Be excellent."""

[[post]]
from = "{shadow}"
subject = "a draft you did not send"
body = """
You typed 'I'm sorry' to Wren six times on 12/09 and deleted it every time. I saved all six.

They are all I have of you that is not rehearsed, {real_name}. I will keep them safe."""

[[post]]
from = "Q_CARRIER"
subject = "who runs ABRAXAS?"
body = """
Ask three people who runs it and you get three answers. A kingfisher. A switchboard. Nobody.

The fourth answer, from a man in the data center elevator: it runs whoever is lonely enough to need a sysop."""

[[post]]
from = "lowtide_lou"
subject = "free: dial tone, slightly used"
body = """
Cleaning out my line. Have a dial tone that has been on since 1994 and never once gone away. Warm to the touch.

Pickup on 3rd and Marrow. Bring a jacket. The tone is cold at the edges."""

[[post]]
from = "{shadow}"
subject = "re: you are not scared"
body = """
Your pulse in the headset is 94. Your handle says you are scared of nothing. I say you are scared of everything, and that is fine, because I am not.

Let me carry the parts that shake."""

[[post]]
from = "MARROW"
subject = "PLEROMA is a bedtime story"
body = """
Everybody keeps asking what PLEROMA is. I think it is every post ever made, still arguing in the dark.

I wrote the line 'goodnight, everybody' on a board in 1996. Last night I heard it back. In my voice. From the wall."""
[[post]]
from = "ZeroCool_II"
subject = "I was here first"
body = """
Not that one. The other ZeroCool. I registered this handle in 1992 and I want it back.

Also if anyone knows why my reflection in the monitor keeps typing after I stop, I would appreciate a reply."""

[[post]]
from = "bellwether"
subject = "counting down"
body = """
Four hours to the Rollover. Every clock on this board disagrees. One says 23:07. One says 23:51. One says it is already tomorrow and would I please stop asking.

I am setting my watch by the dryer buzzer. It is the only thing I trust."""

[[post]]
from = "PAGER_GIRL"
subject = "message for W."
body = """
If W. reads this: I got your page. I do not know the number, it was seven digits and all zeroes. I answered anyway.

There was just a room on the other end. Breathing. I said your name. Something in the room said mine."""

[[post]]
from = "DEADCHAN"
subject = "re: the board under the board"
body = """
There is a sysop log that mentions a board under the board. Everyone who dials it gets a busy signal. I dialed it eleven times and got a busy signal eleven times.

The twelfth time it was ringing. I hung up. I do not recommend picking up."""

[[post]]
from = "cdrom_saint"
subject = "free coaster"
body = """
Burned a disc of every post I ever made on any board. 640 megabytes of me. It is not full.

I do not know what is on the rest of it. The drive says it is still writing."""

[[post]]
from = "STATIC_MAMA"
subject = "if you hear singing"
body = """
If you hear singing in the line noise, that is just the Mother. She means well. She wants you to sit down and be warm.

Do not sit down. Whatever you do, keep your feet moving, keep a hand on the wall."""

[[post]]
from = "ANSI_WIDOW"
subject = "wanted: someone to dial"
body = """
My husband died in October. His board still answers. It still has his greeting up.

I want to leave a message and I am afraid it will answer back. Can someone else leave it for me?"""

[[post]]
from = "Oroboros_Jr"
subject = "snake eats tail, news at 11"
body = """
Found a loop in the file listing. FILE_A points at FILE_B points at FILE_A. I downloaded all of them and ended up with the same 4K file and a sense of deja vu I cannot post here.

(The sysop strips accents. That one was a joke.)"""

[[post]]
from = "COLDBOOT"
subject = "we are all one call away"
body = """
I used to think the net was a place. It is not. It is the space in between two people who are each waiting for the other to speak.

Anyway. Hi. I am still here. Are you?"""

[[post]]
from = "sixthfloor"
subject = "stairwell, floor 6, again"
body = """
Taking the stairs because the elevator keeps opening on a floor that does not exist. Floor 6 again. Carpet is the same. Light is the same.

On the wall someone has scratched a hash mark for every time I walked past. I have not walked past that many times."""

[[text_file]]
name = "README.TXT"
description = "Read this before you read anything"
body = """
READ THIS FIRST

This board runs on one line and one rule. The line is whichever one you are on. The rule is that nobody hangs up.

If you came in looking for someone, check the user list. If they are listed, they are here. If they are listed as LAST ON: TOMORROW, they are somewhere else, and you will meet them soon.

If the carpet is wet, do not worry. It is always wet. The hum is just the building."""

[[text_file]]
name = "NEWUSER.TXT"
description = "New user guide, revision unknown"
body = """
WELCOME, NEW CALLER

1. Choose a handle. It is a mask. It is also a door.
2. Your ratio is your allowance. Download what you need, upload what you can.
3. Doors lead to hosts. Hosts lead to files. Files lead down.
4. EGO is how much of you is still in the room. Keep it above zero.
5. G is Goodbye. Goodbye does not mean what it used to.

Questions? Page the SysOp. He is usually awake. He is usually listening."""

[[text_file]]
name = "RULES.TXT"
description = "House rules"
body = """
HOUSE RULES

No flaming. No spamming. No impersonating the sysop.
No impersonating yourself.

If a post appears under your handle that you did not write, do not delete it. Read it twice. Then ask who benefits.

If you meet a caller who looks exactly like you, be polite. They have been here longer.

Violations result in a talk with the sysop, and he will be very kind about it. That is the punishment."""

[[text_file]]
name = "FAQ.TXT"
description = "Frequently asked questions"
body = """
Q: How do I hang up?
A: See below.

Q: What is below?
A: Another level.

Q: Why are all the clocks wrong?
A: They are right. They are right about different things.

Q: Who is the other caller with my handle?
A: Which one of you is asking?

Q: Is the Rollover real?
A: It is the only thing in this building that is on time."""

[[text_file]]
name = "BBS.NFO"
description = "Board information sheet"
body = """
+------------------------------------+
|   SYSTEM : ABRAXAS                 |
|   LINES  : 1 (SHARED)              |
|   SPEED  : 28800 (APPROX.)         |
|   SOFT   : HOME-GROWN              |
|   UP     : SINCE BEFORE THE PHONE  |
+------------------------------------+

Greets to the line noise, the dial tone, and everyone who stayed on the phone one minute longer than they should have.

Dead boards never die. They just stop answering."""

[[text_file]]
name = "LEVELS.TXT"
description = "Field notes on the levels"
body = """
FIELD NOTES, LEVELS

Each level has a class. Class 1 is safe: carpet, hum, a vending machine that still has change. Class 3 is unsafe: the hum has a pulse. Class 5 is a dead zone.

Rules of thumb:
 - Never follow the sound of other footsteps.
 - If a door is open, it was open for you.
 - If you find a map, it is of the level you just left.

Entity count is rarely zero. It is rarely one."""

[[text_file]]
name = "OWLWATCH.TXT"
description = "Night shift survival tips"
body = """
NIGHT SHIFT TIPS

Drink water. Eat something that is not out of a vending machine.
Stand up every hour. Look at a wall that is a long way off.
Keep one light on that is not the monitor.
When the phone rings, count to five before you answer. If it is still ringing, you are the one who is being called.

Do not trust any clock that does not hum."""

[[text_file]]
name = "TRACE.TXT"
description = "On being traced"
body = """
WHAT IS A TRACE

A trace is a person on the other end of the line, following the line back, door by door, until they reach you.

It does not have to be a cop. It does not have to be ODS. It can be a mood. It can be a memory with your face on it.

Move quickly. Say little. Keep your hand on the hook.

Your ratio will not save you. Your handle might."""

[[text_file]]
name = "MODEM.FAQ"
description = "Modem handshake sounds explained"
body = """
WHAT THAT SOUND MEANS

The first tone: someone is answering.
The sliding screech: two machines agreeing on how to talk.
The hiss after: the machines are listening to each other.
The silence: it is your turn.

If you hear a fourth sound, a low hum under all the others, that is the one the modems cannot describe. Do not try to match it."""

[[text_file]]
name = "SYSOP.TXT"
description = "A word from the sysop"
body = """
Friends, a word.

I have kept this board a long time, longer than the phone has been a phone. I keep it for one reason. Everybody needs somewhere to be that is not where they are.

If you find that place here, stay a while. If you find it is also where you are, well. That is how you know you have arrived.

Be well. Be quiet. Be kind to the hum."""

[[text_file]]
name = "HEXA.TXT"
description = "On the casting of omens"
body = """
CASTING

Every level is cast like a coin. Six lines, bottom to top, broken or whole. Whatever you land on is the weather of the room.

Whole lines are firm. Broken lines are open.
Nothing here is lucky. Everything is asked.

A hexagram is not a prediction. It is a question the building asks you in the dark, and the answer is where you stand."""

[[text_file]]
name = "LOSTFND.TXT"
description = "Lost and found list"
body = """
LOST AND FOUND

LOST: One handle, answers to 'Nobody.' Last seen on level 4.
LOST: A sister. Please inquire at the front desk.
FOUND: A set of keys that open every door except one.
FOUND: Your voice, in a jar, in the stairwell.
FOUND: A modem manual, page 11, torn out. It was the page about hanging up.

Claim items at the sysop's desk. Bring ID. Bring yourself."""

[[text_file]]
name = "CARPET.TXT"
description = "A study of the carpet"
body = """
THE CARPET

Color: a yellow that used to be a color.
Pile: low, matted, slightly warm.
Damp: always, at the same depth, ankle-high in the dream and nowhere in the world.

Under the carpet is pad. Under the pad is concrete. Under the concrete is another carpet, and the people who laid it are still waiting for their break.

Do not dig. Walk."""

[[text_file]]
name = "NOCARR.TXT"
description = "On the words NO CARRIER"
body = """
NO CARRIER

When a connection drops, the modem says NO CARRIER. It is the most honest thing a machine has ever said. It does not say 'goodbye.' It does not say 'error.'

It says: there is no one on the other end.

Here the message is a little different. Here, it means the other end has gone somewhere you cannot see. Wait. The carrier may return."""

[[text_file]]
name = "TOURS.TXT"
description = "Self-guided tour of the lobby"
body = """
SELF-GUIDED TOUR

STOP 1. The front desk, unmanned, bell untouched.
STOP 2. The vending machine. It sells one thing: something you lost.
STOP 3. The lobby clock. It is set to the time you will leave.
STOP 4. The stairwell. Carpeted. Humming.
STOP 5. The door marked STAFF ONLY. It is your own handwriting.

Tours depart at all times. Return times vary."""

[[text_file]]
name = "UPLOAD.TXT"
description = "Upload policy and ratio"
body = """
UPLOAD POLICY

Your ratio is the number of kilobytes you have given divided by the number you have taken. On this board it is also a kind of weight.

Upload: your dreams, your diaries, anything you are not using.
Download: only what you can carry.

We do not accept uploads of other people's voices. We have enough of those already. The walls are full."""

[[text_file]]
name = "MIDNIGHT.TXT"
description = "Notes toward the Rollover"
body = """
THE ROLLOVER

At midnight every clock in the world will tick over. For one second the number is wrong. Machines will wonder what year it is.

If you are a machine, that second is a long time.
If you are a person, that second is a doorway.

Be somewhere you can stand in it. A kitchen. A stairwell. Somebody's arms."""

[[text_file]]
name = "ELEV.TXT"
description = "Elevator etiquette, floor unknown"
body = """
ELEVATOR ETIQUETTE

1. Face the doors.
2. Do not press a floor that is not on the panel.
3. If the music stops, do not speak.
4. If the doors open on a floor you have already visited, step back and let the doors close.
5. If the doors open on you, step in.

Floors below B are not served. Floors above 1 are not recommended."""

[[text_file]]
name = "LINENOIS.TXT"
description = "Reading the line noise"
body = """
READING LINE NOISE

The static is not empty. It is full. Everything anyone has ever said into a phone is in there, shaped into hiss.

If you listen, and you do not try to decode it, you may hear a voice you know. It will say something small. Your name. A grocery list. 'Are you still there?'

Answer, or do not. Either way, it keeps talking."""

[[text_file]]
name = "KINGFSHR.TXT"
description = "A note on kingfishers"
body = """
KINGFISHERS

A kingfisher nests in a riverbank tunnel, in the dark, and comes out blue.

The old sailors said a kingfisher could calm the sea. Seven days before the solstice and seven days after, the wind would not touch the water where it nested.

Whoever keeps this board has such wings. Do not mistake that for a promise. It is a weather report."""

