level_cards = [
  "Field note: the hallway is longer than the building. You count forty doors and the same fire extinguisher. Somewhere ahead: {motif}. The hum rises when you stop walking.",
  "Explorer's log. The ceiling tiles sag with damp, and every room smells of old coffee and warm dust. Noted: {motif}. {shadow} was here first; the chair is still turning.",
  "Note to self: do not trust the exit signs. They point at each other. Faint, as if heard through a wall of water: {motif}.",
  "The floor is carpet the colour of a bruise. Every light panel flickers on its own beat, out of phase with the next. Everywhere: {motif}. Whoever runs this board has not slept.",
  "This level was a call center once. Headsets hang on every chair, still warm. One line is lit, waiting for {handle} to pick up. Noted: {motif}.",
  "Stairs go down to a landing, and the landing goes down to the same landing. Count your breaths, not your steps. Keep watch for: {motif}. The board is on the third landing, or the thirtieth.",
  "Field note: the air is thick with the smell of ozone and wet plaster. Monitors glow in rooms with no desks. Persistent: {motif}. Do not read the screens aloud.",
  "A quiet level. Too quiet. The fluorescent tubes buzz at one pitch, and your deck hums back in sympathy. Underlying it all: {motif}. The board is open, and it is expecting you by name.",
  "You step out into an atrium with no roof, only a grid of dead lights. Rain falls from nowhere and does not wet the floor. Observed: {motif}. The terminal at the centre is dry.",
  "The rooms here fold into one another like a bad memory. You can see your own back through three doorways. Noted: {motif}. {shadow} is not in any of them, and that is worse.",
  "Explorer's note: everything is beige. The walls, the phones, the sky through the window slits. Recurring: {motif}. The only colour is the cursor, and it is blinking faster than you are breathing.",
  "A loading dock at high tide. Black water laps the lip of the concrete, and cables run down into it like roots. Everywhere: {motif}. The board lives in the one cabinet that is still dry.",
  "Someone has set out folding chairs facing a dead television. Forty of them. All of them warm. Logged: {motif}. The set flickers on when you sit, and it knows your handle.",
  "The corridor has no end you can see, only a long diminishing row of doors. Each one is a different number of floors from the last. Keep watch for: {motif}. The right door hums your name in a low note.",
  "This level smells of rain-soaked cardboard and toner. Boxes stacked to the ceiling are labelled in your handwriting. Persistent: {motif}. Do not open the one marked TOMORROW.",
  "Field note: a skybridge between two buildings that were never built. Wind, but no air. Underlying it all: {motif}. The board's terminal is bolted to the rail, glowing, patient.",
  "The elevator opens on a floor that is only a floor. Carpet, lights, a single payphone with its cord cut. Observed: {motif}. It rings once for each year you have been awake.",
  "A motel corridor, every door ajar, every room showing a screen. In each, a caller types the same line you are about to type. Noted: {motif}. The last room is empty and the screen is yours.",
  "The ground is a grid of tiles, and some of them are cold. Step only on the warm ones, and listen to the dial tone under the floor. Recurring: {motif}. The board waits in the one room with a door that closes.",
  "Everything here was installed in 1994 and never switched off. Dust lies thick on the keyboards, but the fans still spin. Everywhere: {motif}. Someone has left a light on in the sysop's office for years.",
  "An empty trade show. Banners for products that never shipped flutter in a draft you cannot feel. Logged: {motif}. At the far booth, a modem is picking up the line on its own.",
  "The stairwell smells of cold concrete and floor wax. Each landing has a number painted over, and under the paint, a different number. Keep watch for: {motif}. {handle}, the board is on the landing that is not there yet.",
]

