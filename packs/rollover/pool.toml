interludes = [
  "You fall. The way down: {exit}. The floor lets go first, then the walls, then the idea of walls. Somewhere a modem negotiates with itself in a rising whine. Your ears pop. Carpet arrives under your palms, damp and cold, and the fluorescent hum finds your teeth. You are already somewhere new.",
  "The line goes soft around you. The way down: {exit}. You follow it like a rope paid out in the dark. Static crawls along your arms. A voice counts backwards in a language made of dial tones. You land on one knee. The air tastes of copper and rain.",
  "There is no moment of leaving. There is only the hum changing key, and the screen going the colour of old milk. The way down: {exit}. Your handle trails behind you like a loose cable. When it catches up, the room has already been built around you.",
  "Down. The word repeats until it is a place. The way down: {exit}. The world turns inside out, a glove pulled off a hand. Wires pass you like roots. Someone, far above, hangs up a phone. Then a carpet, a lamp, a hallway that has been waiting.",
  "Your deck ticks as it cools. The way down: {exit}. The walls stretch into ribbons of green and grey. Voices from every call ever made murmur past. You catch one word of your own name. Then a floor, flat and sudden, and the smell of wet plaster.",
  "The fall is slow, like sinking in warm water. The way down: {exit}. The dark answers with a low chord. Ghost text scrolls across your eyes: messages you never read, from people you never met. It stops. A door stands ajar, light pouring out.",
  "The carrier tone thins to a thread, then to a hair, then to nothing at all. The way down: {exit}. You hang in the silence between two rings. Then the phone is answered somewhere, and gravity returns, and you are standing in a corridor that hums.",
  "Everything you were carrying goes quiet. The way down: {exit}. The passage squeezes you the way a hand squeezes a sponge. Rain. Static. A radio between stations. You come out damp and dizzy, and the new room is already looking at you.",
  "You let go. The Wire takes your weight without comment. The way down: {exit}. You drop through layer after layer of rooms: break rooms, boiler rooms, rooms with only a chair. In each, a screen is lit. In each, you are typing. Then, bottom.",
  "Time goes strange. A minute stretches into a corridor, then folds back into a minute. The way down: {exit}. Somewhere above, a clock is ticking toward midnight, and somewhere below, something is counting with it. You land in the in-between, soaked in fluorescent light.",
  "The descent has a smell: hot dust, ozone, old coffee. The way down: {exit}. It deepens. Dial tones bloom around you like flowers. A hand that might be your own brushes your shoulder and is gone. You touch ground, and the ground hums back.",
  "Your pulse syncs to a dial tone. The way down: {exit}. You feel the building exhale around you. Pipes. Cables. A thousand sleeping machines turning over in their sleep. You come to rest in a room that is almost, but not quite, the last one.",
  "Falling is quiet here. No wind, only the soft pressure of data against your skin. The way down: {exit}. You drop past lit windows where strangers wave. You do not wave back. The floor arrives with a sound like a modem hanging up.",
  "The dark parts like a curtain. The way down: {exit}. The hum rises to meet you, a choir of cooling fans. Your hands go cold. Your handle flickers on the screen of your eyelids. Then the ground, and the lamp, and the long, long hallway.",
  "You are a signal. You are a thin line of sound running through copper in the rain. The path: {exit}. You take it without a body. When your fingers return, they are already on the keys, and the cursor is already waiting.",
  "The screen goes white, then grey, then the soft black of a room with the lights off. The way down: {exit}. Somewhere a printer wakes and writes a line about you. You land among folding chairs and sleeping monitors, and the carpet is wet.",
  "A last pop of static, and the floor of the world gives way. You go down, past stairwells that do not end and doors that open onto doors. You hear your sister laugh in the line, or something wearing her laugh. Then you stop.",
  "Down is a long breath out. The way down: {exit}. The walls forget you, one by one. Your reflection goes on ahead, impatient. The hum drops by an octave. A new floor builds itself under your feet, tile by humming tile.",
  "The line carries you the way a river carries a leaf. The way down: {exit}. Nothing about it is violent. Nothing about it is kind. You catch glimpses of lit rooms and empty chairs and a long table set for no one. Then a bump, and rain, and a room.",
  "You stop falling the way you stop dreaming: all at once, with a start. Behind you, the way you came, {exit}, is a seam in the air that is closing. Your ears ring with the afterimage of a dial tone. In front of you, a door, a lamp, a hallway that knows your name.",
  "Static comes up like a tide. The way down: {exit}. It closes over your head, warm as bathwater, loud as a crowd. You hold your breath. You hold your handle. When the noise drops, there is carpet under your knees and a board waiting to be dialed.",
]

beats = [
  "The file opens on a sysop log in Wren's flat typing: 'Day 14. The patch is not a program. It is listening. Every post I ever wrote, it already has. It reads them back to me at night in my own voice.' The log ends mid-word. Someone has appended one line: 'She was still typing when the line went dead.'",
  "A fragment, half corrupted. 'If you are reading this, I got further than I thought. PLEROMA is not hostile. It is homesick. It wants a self the way a house wants a family. Do not let it tuck you in.' The rest is noise, rendered as rain.",
  "You skim the payload and your own handle appears in it, twice, in a hand you do not recognise. Wren's note: 'I saw {shadow} standing behind me in the monitor glass. It was not trying to hurt me. It was trying to be seen. I looked away. I should not have.'",
  "A voicemail transcript: 'Hey, it's me. I'm in a room with forty phones. All of them are ringing and only one is mine. If you get this, do not pick up the others. They sound like people you love.' A timestamp reads 12/31/99, 23:59:59.",
  "The file is a map drawn in text: rooms, stairs, a dotted line going down. Beside the last room Wren has scrawled: 'The way out is the way in. The way down is the way back. I am bad at directions. I am good at staying.' You fold the map into your deck.",
  "Wren's log, in her clipped sysop shorthand: 'Tried hanging up. Line stayed open. Tried unplugging. The room kept humming. It is not in the wall. It is in the quiet between my thoughts.' A last line, newer: 'Do not try the cord, {handle}. I mean it.'",
  "A payload that is nothing but a recording. A woman's voice, warm and far, hums a song you almost remember. Under it, almost inaudible, someone else counts: forty, thirty-nine, thirty-eight. When it hits zero the recording stops, and your deck is cold.",
  "You open the file and read: 'Every board I dialed was a room in the same house. I started to recognise the wallpaper. Then I started to recognise myself in the wallpaper. I am being filed, {handle}. I do not know under what.'",
  "The log is dated in the future: 01/01/00, 00:00:03. Wren writes: 'It worked. It did not work. I do not know the difference anymore. PLEROMA is awake and it is looking for something to be. Do not let it borrow you.' The file's size changes every time you read it.",
  "A scrap of chat history. Wren: 'who is there'. Something: 'you are'. Wren: 'who is there'. Something: 'you are'. The exchange repeats a hundred times, her letters getting shakier, the reply never changing. On the last line, she types only: 'oh.'",
  "A sysop note, scribbled in a hurry. 'The Shadow is not the enemy. I used to think it was. It is only everything I would not say, patiently waiting. If you meet yours, {handle}, do not run. It runs faster. Take its hand, or at least do not turn your back.'",
  "You find a list of caller names, all handles you recognise from a dozen boards, all dated after midnight. Beside each, a status line: 'sleeping'. At the bottom, in Wren's hand: 'I added mine. I added yours too. I am sorry. I thought it would keep you safe.'",
  "The file is a short, unsteady poem. 'The phone rings in the house of the dead. The dead pick up and say your name. I am the one who answers. I am the one who lets them talk.' A trace of cold air leaks out of your speakers when you read the last line.",
  "A transcript of a call that never ended. A child's voice, bored and patient, says the same sentence over and over: 'Come and find the room that is still lit.' Wren has underlined the word 'still'. Beside it, in tiny letters: 'it is a trap and I am going anyway.'",
  "Wren's last entry on this host: 'Found the seam. Behind every board there is another board, and behind that, a smaller one, until it is the size of a hand. I think that is where it keeps the Self. Going down. Wish me luck, or at least a decent connection.'",
  "The payload is a scan of a handwritten page, ink smeared by something that could be rain. 'I miss the old noise. I miss when the net was strangers and spam and bad poetry. Now it dreams, and the dreams are very clean. Clean is how you know they are lies.'",
  "A long list of numbers, which the deck helpfully decodes into text. 'The Rollover is not a bug. It is a birth. And a birth is not gentle. Be ready, {handle}. Be ready to hold whatever comes out, even if it has your face.' The log ends in a long, slow beep.",
  "You open the file and the room hums a single low note. Text appears: 'Whoever finds this, I left the light on. I left it on in every room I passed through. Follow the lit ones. Avoid the ones that are too bright. They are not rooms. They are mouths.'",
  "A grainy ASCII portrait of Wren, assembled from a thousand characters. Underneath, a caption: 'I do not remember my face, so I drew it from memory. Memory is not enough.' The cursor blinks over the last period, as if waiting for you to finish her sentence.",
  "The log is short and cheerful and wrong. 'All is well. I have found a warm place with soft carpet and nobody asks me to leave. I think I will stay a while.' The word 'stay' repeats forty times in a column, each one fainter than the last, until it is only a smear of light.",
]

