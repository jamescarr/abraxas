# Publishes the tagged version to crates.io via trusted publishing.
# Called by release.yml (generated by dist); crates.io's trusted publisher must name release.yml, not this file.
name: PublishCrates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  cargo-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.11
          install_args: rust
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - name: Skip if this version is already on crates.io
        id: exists
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "abraxas-bbs") | .version')"
          code="$(curl -s -o /dev/null -w '%{http_code}' -A 'abraxas-release (https://github.com/jamescarr/abraxas)' "https://crates.io/api/v1/crates/abraxas-bbs/${version}")"
          case "$code" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"; echo "abraxas-bbs ${version} is already on crates.io; skipping" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io returned HTTP ${code} for abraxas-bbs ${version}"; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.exists.outputs.published == 'false'
      - name: cargo publish
        if: steps.exists.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
