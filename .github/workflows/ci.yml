name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.11
          install_args: rust
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - run: mise run check
