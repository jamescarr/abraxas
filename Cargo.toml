[package]
name = "abraxas"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A 1999 BBS hacker game that dreams its own levels."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
include_dir = "0.7"
rand = "0.10"
ratatui = "0.30.2"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = { version = "0.25.2", features = ["std-duration"] }
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tui-big-text = "0.8.10"
ureq = { version = "3.4", features = ["json"] }

[dev-dependencies]
parking_lot = "0.12"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
