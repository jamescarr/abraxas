<text x="0" y="194" fill="#aaaaaa" textLength="486" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   tube hums a note flat of anything you              </text>
<text x="486" y="194" fill="#aa0000" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ████   ████   </text>
<text x="0" y="212" fill="#aaaaaa" textLength="486" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   know. The board says it has always been            </text>
