<text x="0" y="158" fill="#aaaaaa" textLength="486" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   Field note: Level 0 is a lobby with a              </text>
<text x="486" y="158" fill="#aa0000" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ███████████   </text>
<text x="0" y="176" fill="#aaaaaa" textLength="486" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   menu. The carpet is damp. One fluorescent          </text>
