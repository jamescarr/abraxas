<text x="0" y="230" fill="#aaaaaa" textLength="486" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   here, and that you called it. There is a           </text>
<text x="486" y="230" fill="#aa0000" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ████   ████   </text>
<text x="0" y="248" fill="#aaaaaa" textLength="486" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   door marked D. There is no door marked             </text>
<text x="486" y="248" fill="#aa0000" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ████   ████   </text>
<text x="0" y="266" fill="#aaaaaa" textLength="486" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   Hang Up.                                           </text>
<text x="486" y="284" fill="#aa0000" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve">52 KEEPING STILL</text>
