<text x="198" y="86" fill="#aa0000" textLength="315" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Nobody dials us. Everybody arrives.</text>
<text x="0" y="104" fill="#aa0000" textLength="720" lengthAdjust="spacingAndGlyphs" xml:space="preserve">═════════════════════ SysOp: PHILEMON │ Level 00 │ Class 1 ═════════════════════</text>
<rect x="18" y="126" width="342" height="18" fill="#aaaaaa"/>
<text x="18" y="140" fill="#000000" textLength="342" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[M] Message bases                     </text>
<text x="360" y="140" fill="#aa0000" textLength="27" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[F]</text>
<text x="387" y="140" fill="#aaaaaa" textLength="333" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> File library                        </text>
<text x="18" y="176" fill="#aa0000" textLength="27" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[C]</text>
<text x="45" y="176" fill="#aaaaaa" textLength="315" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Page the SysOp                    </text>
<text x="360" y="176" fill="#aa0000" textLength="27" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[U]</text>
<text x="387" y="176" fill="#aaaaaa" textLength="333" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> User list                           </text>
<text x="18" y="212" fill="#aa0000" textLength="27" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[D]</text>
<text x="45" y="212" fill="#aaaaaa" textLength="315" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Door: Pull WREN-00.LOG off th...  </text>
<text x="360" y="212" fill="#aa0000" textLength="27" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[A]</text>
<text x="387" y="212" fill="#aaaaaa" textLength="333" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Archive                             </text>
<text x="18" y="248" fill="#aa0000" textLength="27" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[S]</text>
<text x="45" y="248" fill="#aaaaaa" textLength="315" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Self                              </text>
<text x="360" y="248" fill="#555555" textLength="342" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[G] Goodbye                           </text>
<text x="18" y="302" fill="#555555" textLength="684" lengthAdjust="spacingAndGlyphs" xml:space="preserve">┌─[ SYSOP NEWS ]───────────────────────────────────────────────────────────┐</text>
<text x="18" y="320" fill="#555555" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│ </text>
<text x="36" y="320" fill="#aaaaaa" textLength="603" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Field note: Level 0 is a lobby with a menu. The carpet is damp. One</text>
<text x="639" y="320" fill="#555555" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve">      │</text>
<text x="18" y="338" fill="#555555" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│ </text>
<text x="36" y="338" fill="#aaaaaa" textLength="630" lengthAdjust="spacingAndGlyphs" xml:space="preserve">fluorescent tube hums a note flat of anything you know. The board says</text>
<text x="666" y="338" fill="#555555" textLength="36" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   │</text>
<text x="18" y="356" fill="#555555" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│ </text>
<text x="36" y="356" fill="#aaaaaa" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve">it has always been here, and that you called it. There is a door mark...</text>
<text x="684" y="356" fill="#555555" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> │</text>
<text x="18" y="374" fill="#555555" textLength="684" lengthAdjust="spacingAndGlyphs" xml:space="preserve">└──────────────────────────────────────────────────────────────────────────┘</text>
<text x="0" y="410" fill="#aaaaaa" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Command (?=Help): </text>
<text x="180" y="410" fill="#ffffff" textLength="9" lengthAdjust="spacingAndGlyphs" xml:space="preserve">_</text>
<rect x="0" y="432" width="639" height="18" fill="#00aaaa"/>
<text x="0" y="446" fill="#000000" textLength="639" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ABRAXAS │ L00 THE LOBBY │ EGO 100 │ 0096K │ 23:00:00 12/31/99 │       </text>
<text x="639" y="446" fill="#555555" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve">SD</text>
