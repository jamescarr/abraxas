<text x="18" y="302" fill="#555555" textLength="684" lengthAdjust="spacingAndGlyphs" xml:space="preserve">┌─[ SYSOP NEWS ]───────────────────────────────────────────────────────────┐</text>
<text x="18" y="320" fill="#555555" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│ </text>
<text x="36" y="320" fill="#aaaaaa" textLength="603" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Field note: Level 0 is a lobby with a menu. The carpet is damp. One</text>
<text x="639" y="320" fill="#555555" textLength="63" lengthAdjust="spacingAndGlyphs" xml:space="preserve">      │</text>
<text x="18" y="338" fill="#555555" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│ </text>
<text x="36" y="338" fill="#aaaaaa" textLength="630" lengthAdjust="spacingAndGlyphs" xml:space="preserve">fluorescent tube hums a note flat of anything you know. The board says</text>
<text x="666" y="338" fill="#555555" textLength="36" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   │</text>
<text x="18" y="356" fill="#555555" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│ </text>
<text x="36" y="356" fill="#aaaaaa" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve">it has always been here, and that you called it. There is a door mark...</text>
<text x="684" y="356" fill="#555555" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> │</text>
<text x="18" y="374" fill="#555555" textLength="684" lengthAdjust="spacingAndGlyphs" xml:space="preserve">└──────────────────────────────────────────────────────────────────────────┘</text>
